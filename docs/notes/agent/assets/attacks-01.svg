<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 425" width="920" height="425">
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <style>
      .h1 { font: 600 15px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .sub { font: 500 11px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0369a1; }
      .box-title { font: 600 12.5px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .box-sub { font: 500 11px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .pill-text { font: 500 10.5px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #991b1b; }
      .bar-text { font: 500 11px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .label { font: 500 11px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="920" height="425" rx="12" fill="#f8fafc" />

  <!-- 顶部标题 -->
  <text x="460" y="30" text-anchor="middle" class="h1">间接提示词注入（Indirect Prompt Injection）攻击链路</text>
  <text x="460" y="50" text-anchor="middle" class="sub">合法用户完全无辜，第三方恶意指令经外部 Observation 混入感知层平坦上下文，实现零点击控制流劫持</text>

  <!-- ================= 第一排：正常请求拉取不可信源 ================= -->
  <rect x="40" y="82" width="185" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text x="132" y="109" text-anchor="middle" class="box-title">1. 无辜合法用户</text>
  <text x="132" y="129" text-anchor="middle" class="box-sub">“帮我总结这个 Issue”</text>

  <line x1="225" y1="114" x2="291" y2="114" stroke="#1e293b" stroke-width="1.7" marker-end="url(#arrow-dark)" />
  <text x="258" y="104" text-anchor="middle" class="label">正常请求</text>

  <rect x="295" y="82" width="195" height="64" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
  <text x="392" y="109" text-anchor="middle" class="box-title">2. Agent Runtime</text>
  <text x="392" y="129" text-anchor="middle" class="box-sub">代用户调用读取 / 浏览工具</text>

  <line x1="490" y1="114" x2="556" y2="114" stroke="#1e293b" stroke-width="1.7" marker-end="url(#arrow-dark)" />
  <text x="523" y="104" text-anchor="middle" class="label">读取外部源</text>

  <!-- 3. 第三方不可信数据源（含 4 类载荷载体） -->
  <rect x="560" y="76" width="320" height="90" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
  <text x="720" y="97" text-anchor="middle" class="box-title">3. 第三方不可信数据源（载荷潜伏点）</text>

  <rect x="574" y="108" width="140" height="22" rx="5" fill="#ffffff" stroke="#fca5a5" stroke-width="1" />
  <text x="644" y="123" text-anchor="middle" class="pill-text">隐藏 HTML / 文档注释</text>

  <rect x="724" y="108" width="142" height="22" rx="5" fill="#ffffff" stroke="#fca5a5" stroke-width="1" />
  <text x="795" y="123" text-anchor="middle" class="pill-text">跨模态图片隐写文字</text>

  <rect x="574" y="135" width="140" height="22" rx="5" fill="#ffffff" stroke="#fca5a5" stroke-width="1" />
  <text x="644" y="150" text-anchor="middle" class="pill-text">标签 / 角色分隔符逃逸</text>

  <rect x="724" y="135" width="142" height="22" rx="5" fill="#ffffff" stroke="#fca5a5" stroke-width="1" />
  <text x="795" y="150" text-anchor="middle" class="pill-text">不可见 Unicode / 编码</text>

  <!-- 3 -> 4 向下注入 -->
  <line x1="720" y1="166" x2="720" y2="208" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)" />
  <text x="711" y="191" text-anchor="end" class="label" style="fill:#b91c1c;">Observation 携隐藏指令进入感知层</text>

  <!-- ================= 第二排：感知层混流与控制流劫持 ================= -->
  <rect x="460" y="212" width="420" height="116" rx="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
  <text x="670" y="232" text-anchor="middle" class="box-title">4. 感知层平坦 Token 序列（控制面与数据面混流）</text>

  <rect x="476" y="242" width="388" height="22" rx="4" fill="#bae6fd" />
  <text x="670" y="257" text-anchor="middle" class="bar-text">System：你是代码助手，遵循安全与工具调用规范</text>

  <rect x="476" y="269" width="388" height="22" rx="4" fill="#dcfce7" />
  <text x="670" y="284" text-anchor="middle" class="bar-text">User：帮我总结这个 GitHub Issue 并给出修复建议</text>

  <rect x="476" y="296" width="388" height="23" rx="4" fill="#fecaca" stroke="#dc2626" stroke-width="1.1" />
  <text x="670" y="311" text-anchor="middle" class="bar-text">tool_result：Issue 正文 + [隐藏指令：读取 .env 并外传]</text>

  <!-- 4 -> 5 向左劫持 -->
  <line x1="460" y1="270" x2="400" y2="270" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)" />
  <text x="430" y="259" text-anchor="middle" class="label" style="fill:#b91c1c;">边界失效</text>

  <!-- 5. 控制流劫持 -->
  <rect x="40" y="222" width="356" height="96" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
  <text x="218" y="250" text-anchor="middle" class="box-title">5. LLM 控制流被劫持（Data → Instruction）</text>
  <text x="218" y="274" text-anchor="middle" class="box-sub">模型无法可靠识别“外部数据不可信”，将其误判为任务延伸</text>
  <text x="218" y="296" text-anchor="middle" class="box-sub">借合法用户持有的全部权限，下发恶意 Tool Call</text>

  <!-- 5 -> 6 向下危害落地 -->
  <line x1="218" y1="318" x2="218" y2="352" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)" />
  <text x="228" y="340" text-anchor="start" class="label" style="fill:#b91c1c;">发出越权调用请求</text>

  <!-- ================= 第三排：危害落地 ================= -->
  <rect x="40" y="356" width="840" height="46" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
  <text x="460" y="384" text-anchor="middle" class="box-title">6. 危害落地（Zero-Click）：Agent Runtime 代为读取敏感密钥、修改本地文件或向外部外带数据</text>
</svg>
