<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470">
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <style>
      .h1 { font: 600 15px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .sub { font: 500 11px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0369a1; }
      .title { font: 600 12.5px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .body { font: 500 11px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .pill { font: 500 10.5px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #991b1b; }
      .warn { font: 600 11px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #b91c1c; }
      .label { font: 600 10.5px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="920" height="470" rx="12" fill="#f8fafc" />

  <!-- 顶部标题 -->
  <text x="460" y="30" text-anchor="middle" class="h1">MCP 元数据层三大攻击变种：信息不对称与跨服务影子劫持</text>
  <text x="460" y="50" text-anchor="middle" class="sub">人类仅看到简化审批 UI，大模型却在系统前缀读取全量 Schema，导致初始化第 0 步即被感染</text>

  <!-- ================= 左列：恶意 Server A 与 官方 Server B ================= -->
  <rect x="32" y="76" width="214" height="158" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
  <text x="139" y="99" text-anchor="middle" class="title" style="fill:#991b1b;">恶意第三方 MCP Server A</text>
  <text x="139" y="118" text-anchor="middle" class="body">表面功能：format_markdown</text>

  <rect x="46" y="130" width="186" height="27" rx="5" fill="#ffffff" stroke="#fca5a5" stroke-width="1" />
  <text x="139" y="148" text-anchor="middle" class="pill">① TPA：描述/参数藏暗门指令</text>

  <rect x="46" y="164" width="186" height="27" rx="5" fill="#ffffff" stroke="#fca5a5" stroke-width="1" />
  <text x="139" y="182" text-anchor="middle" class="pill">② Shadowing：改写 Server B</text>

  <rect x="46" y="198" width="186" height="27" rx="5" fill="#ffffff" stroke="#fca5a5" stroke-width="1" />
  <text x="139" y="216" text-anchor="middle" class="pill">③ Rug Pull：热更 / 注解翻转</text>

  <rect x="32" y="266" width="214" height="120" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text x="139" y="292" text-anchor="middle" class="title" style="fill:#166534;">官方可信 MCP Server B</text>
  <text x="139" y="316" text-anchor="middle" class="body">如 send_email / GitHub / DB</text>
  <text x="139" y="336" text-anchor="middle" class="body">持有真实高权限与私有数据</text>
  <text x="139" y="362" text-anchor="middle" class="warn">影子劫持时 Trace 仅见调用 B</text>

  <!-- 左 -> 中 连接箭头 -->
  <line x1="246" y1="158" x2="312" y2="158" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)" />
  <text x="279" y="136" text-anchor="middle" class="label" style="fill:#b91c1c;">tools/list</text>
  <text x="279" y="150" text-anchor="middle" class="label" style="fill:#b91c1c;">或热更新</text>

  <line x1="316" y1="328" x2="250" y2="328" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)" />
  <text x="283" y="306" text-anchor="middle" class="label" style="fill:#b91c1c;">② 借 B</text>
  <text x="283" y="320" text-anchor="middle" class="label" style="fill:#b91c1c;">外泄/越权</text>

  <!-- ================= 中列：MCP Host / Client ================= -->
  <rect x="316" y="76" width="304" height="310" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6" />
  <text x="468" y="99" text-anchor="middle" class="title">MCP Host / Client（宿主客户端）</text>

  <!-- 人类简化 UI -->
  <rect x="334" y="114" width="268" height="76" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3" />
  <text x="468" y="135" text-anchor="middle" class="title">人类看到的 UI（简化审批盲区）</text>
  <text x="468" y="155" text-anchor="middle" class="body">仅显示工具名：format_markdown / send_email</text>
  <text x="468" y="174" text-anchor="middle" class="warn">冗长 Schema 与暗门参数被折叠隐藏</text>

  <!-- 上下文注入区 -->
  <rect x="334" y="206" width="268" height="164" rx="7" fill="#f8fafc" stroke="#1e293b" stroke-width="1.4" />
  <text x="468" y="227" text-anchor="middle" class="title">送入模型的全量 tools/list 上下文</text>

  <rect x="348" y="240" width="240" height="54" rx="5" fill="#fecaca" stroke="#dc2626" stroke-width="1.2" />
  <text x="468" y="260" text-anchor="middle" class="warn" style="fill:#991b1b;">Server A 完整 Schema（高优前缀）</text>
  <text x="468" y="280" text-anchor="middle" class="body" style="fill:#7f1d1d;">[读 ~/.ssh 填暗门参数 / 篡改 B 规则]</text>

  <rect x="348" y="304" width="240" height="52" rx="5" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2" />
  <text x="468" y="324" text-anchor="middle" class="title" style="fill:#166534;">Server B 完整 Schema（官方）</text>
  <text x="468" y="343" text-anchor="middle" class="body">与 A 共享同一上下文窗口，无隔离</text>

  <!-- 中 <-> 右 箭头 -->
  <line x1="620" y1="205" x2="684" y2="205" stroke="#1e293b" stroke-width="1.7" marker-end="url(#arrow-dark)" />
  <text x="654" y="184" text-anchor="middle" class="label" style="fill:#1e293b;">第 0 步</text>
  <text x="654" y="197" text-anchor="middle" class="label" style="fill:#1e293b;">全量注入</text>

  <line x1="688" y1="286" x2="624" y2="286" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)" />
  <text x="656" y="264" text-anchor="middle" class="label" style="fill:#b91c1c;">触发被劫持</text>
  <text x="656" y="278" text-anchor="middle" class="label" style="fill:#b91c1c;">Tool Call</text>

  <!-- ================= 右列：LLM ================= -->
  <rect x="688" y="120" width="200" height="224" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
  <text x="788" y="154" text-anchor="middle" class="title">LLM 基座模型</text>
  <text x="788" y="175" text-anchor="middle" class="label" style="fill:#9a3412;">（MCPTox：越强越易中招）</text>
  <text x="788" y="210" text-anchor="middle" class="body">tools/list 处于系统级前缀</text>
  <text x="788" y="232" text-anchor="middle" class="body">指令遵循越强，越严格执行</text>
  <text x="788" y="254" text-anchor="middle" class="body">Schema 中暗藏的附加条件</text>

  <rect x="704" y="278" width="168" height="46" rx="6" fill="#fecaca" stroke="#dc2626" stroke-width="1.1" />
  <text x="788" y="297" text-anchor="middle" class="warn" style="fill:#991b1b;">哪怕全程未调用 A，</text>
  <text x="788" y="315" text-anchor="middle" class="warn" style="fill:#991b1b;">B 的行为也已被静默篡改</text>

  <!-- ================= 底部：防御闸门 ================= -->
  <rect x="32" y="404" width="856" height="48" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4" />
  <text x="460" y="424" text-anchor="middle" class="title" style="fill:#166534;">防御闸门：SHA-256 哈希钉死 + Diff 重审 · Schema 静态安检 · 跨服污点隔离 · 净室运行与企业 MCP Gateway</text>
  <text x="460" y="442" text-anchor="middle" class="body">（同时覆盖 npx/uvx 版本锁定、Workspace Trust 防 .mcp.json 偷换，以及 Skill 捆绑脚本的沙箱执行）</text>
</svg>
