<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="920" height="460">
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <style>
      .h1 { font: 600 15px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .sub { font: 500 11px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0369a1; }
      .atk-title { font: 600 12.5px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #991b1b; }
      .atk-warn { font: 600 11px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #b91c1c; }
      .hub-tag { font: 600 11px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0369a1; }
      .hub-title { font: 600 12.5px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .def-title { font: 600 12.5px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #166534; }
      .body { font: 500 11px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .label { font: 600 11px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="920" height="460" rx="12" fill="#f8fafc" />

  <!-- 顶部标题 -->
  <text x="460" y="30" text-anchor="middle" class="h1">执行层三大攻击面与系统级硬隔离防线</text>
  <text x="460" y="50" text-anchor="middle" class="sub">模型 tool_call 经“鉴权 → 解析与沙箱执行 → 网络与渲染出口”落地，三处均属确定性工程组件，可做刚性封堵</text>

  <!-- ================= 第一排：三大攻击面 ================= -->
  <rect x="36" y="76" width="244" height="88" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
  <text x="158" y="98" text-anchor="middle" class="atk-title">1. 向上借权：权限越界</text>
  <text x="158" y="119" text-anchor="middle" class="body">全局静态高权凭证（混淆代理人）</text>
  <text x="158" y="137" text-anchor="middle" class="body">读写工具混同 + .env 密钥裸露</text>
  <text x="158" y="155" text-anchor="middle" class="atk-warn">→ 触碰不该访问的私有资产</text>

  <rect x="338" y="76" width="244" height="88" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
  <text x="460" y="98" text-anchor="middle" class="atk-title">2. 向下穿透：解析穿透</text>
  <text x="460" y="119" text-anchor="middle" class="body">shell=True / SQL 拼接 / 路径穿越</text>
  <text x="460" y="137" text-anchor="middle" class="body">Symlink 逃逸 / XSS / 云元数据 SSRF</text>
  <text x="460" y="155" text-anchor="middle" class="atk-warn">→ 击穿下游解释器拿宿主机权限</text>

  <rect x="640" y="76" width="244" height="88" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
  <text x="762" y="98" text-anchor="middle" class="atk-title">3. 向外泄密：静默外带</text>
  <text x="762" y="119" text-anchor="middle" class="body">Markdown 图片 / Link Unfurling</text>
  <text x="762" y="137" text-anchor="middle" class="body">WebFetch 借道 / UDP 53 DNS 隧道</text>
  <text x="762" y="155" text-anchor="middle" class="atk-warn">→ 绕过人工审批偷运数据出境</text>

  <!-- 攻击箭头向下 -->
  <line x1="158" y1="164" x2="158" y2="208" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)" />
  <text x="166" y="191" text-anchor="start" class="label" style="fill:#b91c1c;">借用高权</text>

  <line x1="460" y1="164" x2="460" y2="208" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)" />
  <text x="468" y="191" text-anchor="start" class="label" style="fill:#b91c1c;">逃逸参数</text>

  <line x1="762" y1="164" x2="762" y2="208" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)" />
  <text x="770" y="191" text-anchor="start" class="label" style="fill:#b91c1c;">侧信道外传</text>

  <!-- ================= 第二排：执行流水线组件 ================= -->
  <rect x="36" y="212" width="244" height="82" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6" />
  <text x="158" y="233" text-anchor="middle" class="hub-tag">阶段 ①：请求入闸</text>
  <text x="158" y="255" text-anchor="middle" class="hub-title">IAM 鉴权与凭证网关</text>
  <text x="158" y="275" text-anchor="middle" class="body">校验调用者身份与工具读写权限</text>

  <line x1="280" y1="253" x2="334" y2="253" stroke="#1e293b" stroke-width="1.7" marker-end="url(#arrow-dark)" />
  <text x="309" y="242" text-anchor="middle" class="label" style="fill:#1e293b;">传参</text>

  <rect x="338" y="212" width="244" height="82" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6" />
  <text x="460" y="233" text-anchor="middle" class="hub-tag">阶段 ②：本地/后端执行</text>
  <text x="460" y="255" text-anchor="middle" class="hub-title">语法解释器与执行环境</text>
  <text x="460" y="275" text-anchor="middle" class="body">Shell / 数据库 / 文件系统边界</text>

  <line x1="582" y1="253" x2="636" y2="253" stroke="#1e293b" stroke-width="1.7" marker-end="url(#arrow-dark)" />
  <text x="611" y="242" text-anchor="middle" class="label" style="fill:#1e293b;">输出/外连</text>

  <rect x="640" y="212" width="244" height="82" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6" />
  <text x="762" y="233" text-anchor="middle" class="hub-tag">阶段 ③：出站与呈现</text>
  <text x="762" y="255" text-anchor="middle" class="hub-title">网络出口与前端渲染器</text>
  <text x="762" y="275" text-anchor="middle" class="body">HTTP/DNS 出站与 Markdown UI</text>

  <!-- 防御箭头向上锁定 -->
  <line x1="158" y1="350" x2="158" y2="298" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)" />
  <text x="166" y="328" text-anchor="start" class="label" style="fill:#166534;">最小权限</text>

  <line x1="460" y1="350" x2="460" y2="298" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)" />
  <text x="468" y="328" text-anchor="start" class="label" style="fill:#166534;">内核隔离</text>

  <line x1="762" y1="350" x2="762" y2="298" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)" />
  <text x="770" y="328" text-anchor="start" class="label" style="fill:#166534;">出站封锁</text>

  <!-- ================= 第三排：四项工程防线 ================= -->
  <rect x="36" y="350" width="244" height="88" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text x="158" y="373" text-anchor="middle" class="def-title">防线 ①：锁权限（OBO + 盲代理）</text>
  <text x="158" y="395" text-anchor="middle" class="body">用户 OBO 身份透传 + 读写拆分</text>
  <text x="158" y="415" text-anchor="middle" class="body">沙箱内只给占位符，代理网关填密钥</text>

  <rect x="338" y="350" width="244" height="88" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text x="460" y="373" text-anchor="middle" class="def-title">防线 ②③：固解析 + 内核微沙箱</text>
  <text x="460" y="395" text-anchor="middle" class="body">禁用 shell=True + 参数化 + realpath</text>
  <text x="460" y="415" text-anchor="middle" class="body">Seatbelt / Landlock 物理禁读 ~/.ssh</text>

  <rect x="640" y="350" width="244" height="88" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text x="762" y="373" text-anchor="middle" class="def-title">防线 ④：断外带（代理 + CSP）</text>
  <text x="762" y="395" text-anchor="middle" class="body">出站域名白名单 + 封直连 UDP/53</text>
  <text x="762" y="415" text-anchor="middle" class="body">客户端 CSP 禁加载未知外部图片</text>
</svg>
