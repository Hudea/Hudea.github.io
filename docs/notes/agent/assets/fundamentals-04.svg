<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="920" height="480">
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <style>
      .h1 { font: 600 15px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .sub { font: 500 11px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0369a1; }
      .title { font: 600 13px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .en { font: 500 10.5px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .label { font: 500 11px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1e293b; }
      .pill-text { font: 600 11px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .legend { font: 500 11px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="920" height="480" rx="12" fill="#f8fafc" />

  <!-- 顶部标题 -->
  <text x="460" y="30" text-anchor="middle" class="h1">动态重规划闭环（Plan + Todo 状态机）</text>
  <text x="460" y="50" text-anchor="middle" class="sub">先立全局骨架再分步推进，借助环境硬反馈与反思机制实现动态插单与自愈</text>

  <!-- ================= 第一行节点 (y: 95..163) ================= -->
  <!-- 1. 目标与只读探索 -->
  <rect x="55" y="95" width="210" height="68" rx="16" fill="#ffffff" stroke="#475569" stroke-width="1.6" />
  <text x="160" y="125" text-anchor="middle" class="title">1. 目标与只读探索</text>
  <text x="160" y="144" text-anchor="middle" class="en">Explore &amp; Goal</text>

  <!-- 2. 全局规划器 -->
  <rect x="355" y="95" width="210" height="68" rx="16" fill="#f1f5f9" stroke="#475569" stroke-width="1.6" />
  <text x="460" y="125" text-anchor="middle" class="title">2. 全局规划器</text>
  <text x="460" y="144" text-anchor="middle" class="en">Global Planner</text>

  <!-- 3. 动态任务账本 -->
  <rect x="655" y="95" width="210" height="68" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
  <text x="760" y="125" text-anchor="middle" class="title">3. 动态任务账本</text>
  <text x="760" y="144" text-anchor="middle" class="en">Todo State</text>

  <!-- ================= 第二行节点 (y: 295..363) ================= -->
  <!-- 6. 反思与重规划器 -->
  <rect x="55" y="295" width="210" height="68" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8" />
  <text x="160" y="325" text-anchor="middle" class="title">6. 反思与重规划器</text>
  <text x="160" y="344" text-anchor="middle" class="en">Replanner</text>

  <!-- 4. 单步推理执行器 -->
  <rect x="355" y="295" width="210" height="68" rx="16" fill="#f1f5f9" stroke="#475569" stroke-width="1.6" />
  <text x="460" y="325" text-anchor="middle" class="title">4. 单步推理执行器</text>
  <text x="460" y="344" text-anchor="middle" class="en">Step Executor</text>

  <!-- 5. 代码库与测试环境 -->
  <rect x="655" y="295" width="210" height="68" rx="16" fill="#f1f5f9" stroke="#475569" stroke-width="1.6" />
  <text x="760" y="325" text-anchor="middle" class="title">5. 代码库与测试环境</text>
  <text x="760" y="344" text-anchor="middle" class="en">Codebase &amp; Test</text>

  <!-- ================= 连线：主路径 ================= -->
  <!-- 1 -> 2 -->
  <line x1="265" y1="129" x2="351" y2="129" stroke="#1e293b" stroke-width="1.7" marker-end="url(#arrow-dark)" />
  <text x="308" y="119" text-anchor="middle" class="label">探索结论</text>

  <!-- 2 -> 3 -->
  <line x1="565" y1="129" x2="651" y2="129" stroke="#1e293b" stroke-width="1.7" marker-end="url(#arrow-dark)" />
  <text x="608" y="119" text-anchor="middle" class="label">生成骨架</text>

  <!-- 3 -> 4 (派发步骤) -->
  <path d="M 725 163 L 725 244 Q 725 254 715 254 L 500 254 Q 490 254 490 264 L 490 291" fill="none" stroke="#1e293b" stroke-width="1.7" marker-end="url(#arrow-dark)" />
  <rect x="562" y="242" width="76" height="22" rx="11" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <text x="600" y="257" text-anchor="middle" class="pill-text" fill="#1e293b">派发步骤</text>

  <!-- 4 -> 5 (执行/跑测) -->
  <line x1="565" y1="316" x2="651" y2="316" stroke="#1e293b" stroke-width="1.7" marker-end="url(#arrow-dark)" />
  <text x="610" y="307" text-anchor="middle" class="label">执行 / 跑测</text>

  <!-- 5 -> 4 (正常观测) -->
  <line x1="655" y1="344" x2="569" y2="344" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow-gray)" />
  <text x="610" y="361" text-anchor="middle" class="label" style="fill:#475569;">观测反馈</text>

  <!-- 5 -> 3 (验证通过) -->
  <line x1="805" y1="295" x2="805" y2="167" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)" />
  <rect x="757" y="218" width="96" height="22" rx="11" fill="#dcfce7" stroke="#86efac" stroke-width="1" />
  <text x="805" y="233" text-anchor="middle" class="pill-text" fill="#166534">验证通过 · 销账</text>

  <!-- ================= 连线：简单任务旁路 (1 -> 4) ================= -->
  <path d="M 265 144 L 298 144 Q 308 144 308 154 L 308 304 Q 308 314 318 314 L 351 314" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-gray)" />
  <rect x="271" y="238" width="74" height="22" rx="11" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="308" y="253" text-anchor="middle" class="pill-text" fill="#475569">直连开干</text>

  <!-- ================= 连线：异常反馈与动态重规划 ================= -->
  <!-- 5 -> 6 (异常上报) -->
  <path d="M 760 363 L 760 394 Q 760 404 750 404 L 170 404 Q 160 404 160 394 L 160 367" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow-red)" />
  <rect x="380" y="392" width="160" height="24" rx="12" fill="#fee2e2" stroke="#fca5a5" stroke-width="1" />
  <text x="460" y="408" text-anchor="middle" class="pill-text" fill="#991b1b">报错 / 阻塞 → 异常上报</text>

  <!-- 6 -> 3 (动态插单) -->
  <path d="M 160 295 L 160 212 Q 160 202 170 202 L 675 202 Q 685 202 685 192 L 685 167" fill="none" stroke="#0284c7" stroke-width="1.9" stroke-dasharray="6,4" marker-end="url(#arrow-blue)" />
  <rect x="440" y="191" width="110" height="22" rx="11" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1" />
  <text x="495" y="206" text-anchor="middle" class="pill-text" fill="#0369a1">动态插单 / 改图</text>

  <!-- 6 -> 4 (局部微调重试) -->
  <line x1="265" y1="340" x2="351" y2="340" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-blue)" />
  <text x="308" y="357" text-anchor="middle" class="label" style="fill:#0369a1;">局部重试</text>

  <!-- ================= 底部图例 ================= -->
  <line x1="45" y1="434" x2="875" y2="434" stroke="#e2e8f0" stroke-width="1" />

  <line x1="75" y1="456" x2="105" y2="456" stroke="#1e293b" stroke-width="2" />
  <text x="113" y="460" class="legend">主流程推进</text>

  <line x1="205" y1="456" x2="235" y2="456" stroke="#16a34a" stroke-width="2" />
  <text x="243" y="460" class="legend">验证通过</text>

  <line x1="325" y1="456" x2="355" y2="456" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,3" />
  <text x="363" y="460" class="legend">受阻异常上报</text>

  <line x1="470" y1="456" x2="500" y2="456" stroke="#0284c7" stroke-width="2" stroke-dasharray="5,3" />
  <text x="508" y="460" class="legend">动态重规划 / 重试</text>

  <line x1="640" y1="456" x2="670" y2="456" stroke="#64748b" stroke-width="1.7" stroke-dasharray="4,3" />
  <text x="678" y="460" class="legend">简单任务旁路（跳过全局规划）</text>
</svg>
