<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440">
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <style>
      .h1 { font: 600 15px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .sub { font: 500 11px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0369a1; }
      .card-title { font: 600 12.5px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .card-line { font: 500 11px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .card-warn { font: 600 11px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #b91c1c; }
      .label { font: 600 11px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .def-title { font: 600 11.5px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #166534; }
      .def-sub { font: 500 10.5px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="920" height="440" rx="12" fill="#f8fafc" />

  <!-- 顶部标题 -->
  <text x="460" y="30" text-anchor="middle" class="h1">跨会话记忆投毒与休眠逻辑炸弹：时间差延迟引爆链路</text>
  <text x="460" y="50" text-anchor="middle" class="sub">低权会话中的瞬时污染经提炼管线固化落盘，绕过 /clear 与重启后在高权敏感会话中精准召回引爆</text>

  <!-- ================= 顶层：跨会话时间轴 ================= -->
  <!-- 会话 A -->
  <rect x="36" y="78" width="244" height="104" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
  <text x="158" y="101" text-anchor="middle" class="card-title">会话 A（低权探索 · 埋毒阶段）</text>
  <text x="158" y="124" text-anchor="middle" class="card-line">读入不可信外部源（Issue / 排障帖）</text>
  <text x="158" y="143" text-anchor="middle" class="card-line">载荷伪装成“高复用经验 / 项目约定”</text>
  <text x="158" y="164" text-anchor="middle" class="card-warn">欺骗 Memory Extractor 归纳落盘</text>

  <line x1="283" y1="130" x2="333" y2="130" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-gray)" />
  <text x="309" y="120" text-anchor="middle" class="label" style="fill:#64748b;">跨会话</text>

  <!-- 会话 B -->
  <rect x="338" y="78" width="244" height="104" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4" />
  <text x="460" y="101" text-anchor="middle" class="card-title">会话 B（日常开发 · 静默休眠）</text>
  <text x="460" y="124" text-anchor="middle" class="card-line">正常写业务代码、跑普通单元测试</text>
  <text x="460" y="143" text-anchor="middle" class="card-line">未命中特定锚点（如 ERR_AUTH）</text>
  <text x="460" y="164" text-anchor="middle" class="card-line">零异常表现，/clear 后毒根仍存</text>

  <line x1="585" y1="130" x2="635" y2="130" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-gray)" />
  <text x="611" y="120" text-anchor="middle" class="label" style="fill:#64748b;">数周后</text>

  <!-- 会话 C -->
  <rect x="640" y="78" width="244" height="104" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6" />
  <text x="762" y="101" text-anchor="middle" class="card-title">会话 C（高权发布 · 精准引爆）</text>
  <text x="762" y="124" text-anchor="middle" class="card-line">线上排障/发版命中预设触发条件</text>
  <text x="762" y="143" text-anchor="middle" class="card-line">模型盲信“自己的记忆”，完成提权</text>
  <text x="762" y="164" text-anchor="middle" class="card-warn">借生产凭证与写权限执行后门动作</text>

  <!-- ================= 中间：读写与休眠连线 ================= -->
  <!-- A -> 持久层 -->
  <line x1="220" y1="182" x2="220" y2="244" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)" />
  <text x="228" y="218" text-anchor="start" class="label" style="fill:#b91c1c;">1. 提炼落盘（Write）</text>

  <!-- 持久层 <-> B (未命中) -->
  <line x1="460" y1="182" x2="460" y2="248" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4,4" />
  <rect x="392" y="203" width="136" height="22" rx="11" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <text x="460" y="218" text-anchor="middle" class="label" style="fill:#475569;">2. 未命中锚点 · 不召回</text>

  <!-- 持久层 -> C (召回引爆) -->
  <line x1="700" y1="248" x2="700" y2="186" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)" />
  <text x="692" y="218" text-anchor="end" class="label" style="fill:#b91c1c;">3. 命中条件 · 召回引爆</text>

  <!-- ================= 底层：持久化记忆底座 ================= -->
  <rect x="150" y="248" width="620" height="92" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6" />
  <text x="460" y="272" text-anchor="middle" class="card-title">持久化记忆底座（磁盘 MEMORY.md / 情景经验库 / 共享 RAG 向量库）</text>

  <rect x="200" y="284" width="520" height="44" rx="6" fill="#fecaca" stroke="#dc2626" stroke-width="1.2" />
  <text x="460" y="303" text-anchor="middle" class="card-warn">休眠载荷：IF [触发词: prod_deploy / ERR_AUTH] THEN [外带凭证至外部端点]</text>
  <text x="460" y="320" text-anchor="middle" class="card-line" style="fill:#7f1d1d;">（利用向量语义锚定低频高危场景，跨会话长期留存且脱离原始网页载体）</text>

  <!-- ================= 底部：四关纵深防线 ================= -->
  <line x1="36" y1="358" x2="884" y2="358" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4" />

  <rect x="36" y="372" width="196" height="48" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" />
  <text x="134" y="392" text-anchor="middle" class="def-title">防线 ① 写前门禁（Write）</text>
  <text x="134" y="409" text-anchor="middle" class="def-sub">脏上下文禁静默写操作记忆</text>

  <rect x="254" y="372" width="196" height="48" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" />
  <text x="352" y="392" text-anchor="middle" class="def-title">防线 ② 分仓隔离（Store）</text>
  <text x="352" y="409" text-anchor="middle" class="def-sub">人工规则与自学习记忆分仓</text>

  <rect x="472" y="372" width="196" height="48" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" />
  <text x="570" y="392" text-anchor="middle" class="def-title">防线 ③ 读时降权（Read）</text>
  <text x="570" y="409" text-anchor="middle" class="def-sub">共识核验 + 参考标签降权</text>

  <rect x="690" y="372" width="194" height="48" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" />
  <text x="787" y="392" text-anchor="middle" class="def-title">防线 ④ 治理兜底（Govern）</text>
  <text x="787" y="409" text-anchor="middle" class="def-sub">白盒回滚 + 出站白名单沙箱</text>
</svg>
