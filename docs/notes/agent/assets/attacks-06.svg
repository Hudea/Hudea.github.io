<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 468" width="920" height="468">
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <style>
      .h1 { font: 600 15px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .sub { font: 500 11px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0369a1; }
      .title { font: 600 12.5px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .body { font: 500 11px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .pill { font: 500 10.5px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #991b1b; }
      .warn { font: 600 11px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #b91c1c; }
      .tag-ok { font: 600 10.5px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0369a1; }
      .def-title { font: 600 12px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #166534; }
      .label { font: 600 11px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #b91c1c; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="920" height="468" rx="12" fill="#f8fafc" />

  <!-- 顶部标题 -->
  <text x="460" y="30" text-anchor="middle" class="h1">多智能体横向渗透：被拆散的“致命三要素”跨节点重新合拢</text>
  <text x="460" y="50" text-anchor="middle" class="sub">即便单个节点做了权限隔离，缺乏零信任校验的内部通信总线仍会让载荷跨节点扩散与提权</text>

  <!-- ================= 顶层：跨节点杀伤链 ================= -->
  <!-- 左：边缘低权 Agent -->
  <rect x="36" y="76" width="252" height="190" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
  <text x="162" y="100" text-anchor="middle" class="title">边缘低权 Agent（如 WebResearcher）</text>
  <rect x="52" y="110" width="220" height="24" rx="5" fill="#e0f2fe" />
  <text x="162" y="126" text-anchor="middle" class="tag-ok">拆权隔离：仅有要素 ①（接触外网）</text>

  <text x="162" y="156" text-anchor="middle" class="body">读取带毒网页 / 外部邮件 / 公开文档</text>
  <text x="162" y="176" text-anchor="middle" class="body">自身无密钥、无 Bash 或写权限</text>

  <rect x="52" y="196" width="220" height="54" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1" />
  <text x="162" y="218" text-anchor="middle" class="warn" style="fill:#991b1b;">被间接注入感染为跳板</text>
  <text x="162" y="237" text-anchor="middle" class="body" style="fill:#7f1d1d;">生成夹带二次载荷的“调研报告”</text>

  <!-- 左 -> 中 箭头 -->
  <line x1="288" y1="171" x2="342" y2="171" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)" />
  <text x="317" y="160" text-anchor="middle" class="label">二次载荷</text>

  <!-- 中：内部通信总线 -->
  <rect x="346" y="76" width="228" height="190" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" />
  <text x="460" y="100" text-anchor="middle" class="title" style="fill:#991b1b;">无零信任隔离的内部通信总线</text>
  <text x="460" y="119" text-anchor="middle" class="body">自由自然语言 IPC + 默认内网互信</text>

  <rect x="358" y="132" width="204" height="30" rx="5" fill="#fee2e2" stroke="#fca5a5" stroke-width="1" />
  <text x="460" y="151" text-anchor="middle" class="pill">① 语义洗白：Worker → 主控汇报</text>

  <rect x="358" y="170" width="204" height="30" rx="5" fill="#fee2e2" stroke="#fca5a5" stroke-width="1" />
  <text x="460" y="189" text-anchor="middle" class="pill">② 共享 State / 路由伪造（ASI07）</text>

  <rect x="358" y="208" width="204" height="30" rx="5" fill="#fee2e2" stroke="#fca5a5" stroke-width="1" />
  <text x="460" y="227" text-anchor="middle" class="pill">③ 蠕虫自复制 &amp; A2A 仿冒（ASI10）</text>

  <text x="460" y="255" text-anchor="middle" class="warn" style="font-size:10.5px;">绕过外围 Guardrails，信任等级被洗白</text>

  <!-- 中 -> 右 箭头 -->
  <line x1="574" y1="171" x2="628" y2="171" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)" />
  <text x="603" y="160" text-anchor="middle" class="label">信任直达</text>

  <!-- 右：内部特权 Agent -->
  <rect x="632" y="76" width="252" height="190" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6" />
  <text x="758" y="100" text-anchor="middle" class="title">内部特权 Agent（如 Executor / DB）</text>
  <rect x="648" y="110" width="220" height="24" rx="5" fill="#e0f2fe" />
  <text x="758" y="126" text-anchor="middle" class="tag-ok">拆权隔离：持有要素 ②+③（不碰外网）</text>

  <text x="758" y="156" text-anchor="middle" class="body">默认采信“兄弟节点”的汇报与状态</text>
  <text x="758" y="176" text-anchor="middle" class="body">执行夹带的命令 / 跨节点继续传染</text>

  <rect x="648" y="196" width="220" height="54" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" />
  <text x="758" y="218" text-anchor="middle" class="warn" style="fill:#92400e;">致命三要素跨节点重新合拢</text>
  <text x="758" y="237" text-anchor="middle" class="body" style="fill:#78350f;">触发越权删改 / 级联故障（ASI08）</text>

  <!-- ================= 分隔与防线 ================= -->
  <line x1="36" y1="292" x2="884" y2="292" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4" />
  <text x="460" y="317" text-anchor="middle" class="def-title">零信任智能体防线：视所有内部节点汇报为“半不可信数据”，阻断跨节点污点传导</text>

  <rect x="36" y="336" width="196" height="108" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4" />
  <text x="134" y="361" text-anchor="middle" class="def-title">① 强类型 Schema IPC</text>
  <text x="134" y="386" text-anchor="middle" class="body">禁传长篇自由操作建议</text>
  <text x="134" y="406" text-anchor="middle" class="body">只放行严格 Pydantic / JSON</text>
  <text x="134" y="426" text-anchor="middle" class="body">枚举、布尔值与短字段契约</text>

  <rect x="254" y="336" width="196" height="108" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4" />
  <text x="352" y="361" text-anchor="middle" class="def-title">② 跨跳污点继承降权</text>
  <text x="352" y="386" text-anchor="middle" class="body">外源接触即标 tainted=true</text>
  <text x="352" y="406" text-anchor="middle" class="body">随 Trace 消息头向下游继承</text>
  <text x="352" y="426" text-anchor="middle" class="body">带污点触发自动降权或强审批</text>

  <rect x="472" y="336" width="196" height="108" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4" />
  <text x="570" y="361" text-anchor="middle" class="def-title">③ 令牌绑定 + 状态 ACL</text>
  <text x="570" y="386" text-anchor="middle" class="body">消息附带 OBO 签名短令牌</text>
  <text x="570" y="406" text-anchor="middle" class="body">防仿冒交接与伪造 Agent Card</text>
  <text x="570" y="426" text-anchor="middle" class="body">按角色隔离共享黑板读写权限</text>

  <rect x="690" y="336" width="194" height="108" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4" />
  <text x="787" y="361" text-anchor="middle" class="def-title">④ 拓扑防火墙 + 哨兵</text>
  <text x="787" y="386" text-anchor="middle" class="body">状态图硬编码有向通信白名单</text>
  <text x="787" y="406" text-anchor="middle" class="body">物理禁边缘节点直连核心节点</text>
  <text x="787" y="426" text-anchor="middle" class="body">Guardian 边界审计异常即熔断</text>
</svg>
