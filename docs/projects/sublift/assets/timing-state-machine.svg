<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" width="980" height="480">
  <defs>
    <style>
      .bg { fill: #fafaf8; stroke: #d9dde6; stroke-width: 1.2; }
      .title { font: 700 15px -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Inter', sans-serif; fill: #111318; }
      .eyebrow { font: 600 10.5px 'JetBrains Mono', 'SF Mono', Menlo, monospace; fill: #2b4be0; letter-spacing: 0.08em; }
      .panel { fill: #ffffff; stroke: #cfd5e2; stroke-width: 1.25; }
      .state-empty { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.6; }
      .state-stable { fill: #eef3ff; stroke: #2b4be0; stroke-width: 1.7; }
      .state-prime { fill: #e9f8f5; stroke: #0d9488; stroke-width: 1.7; }
      .box { fill: #ffffff; stroke: #cfd5e2; stroke-width: 1.2; }
      .box-blue { fill: #eef3ff; stroke: #2b4be0; stroke-width: 1.3; }
      .box-teal { fill: #e9f8f5; stroke: #0d9488; stroke-width: 1.3; }
      .box-amber { fill: #fff8eb; stroke: #d97706; stroke-width: 1.3; }
      .h { font: 700 13px -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Inter', sans-serif; fill: #111318; }
      .sub { font: 500 10.8px -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Inter', sans-serif; fill: #4b5260; }
      .mono { font: 600 10.2px 'JetBrains Mono', 'SF Mono', Menlo, monospace; fill: #2b4be0; }
      .mono-teal { font: 600 10.2px 'JetBrains Mono', 'SF Mono', Menlo, monospace; fill: #0d9488; }
      .mono-amber { font: 600 10.2px 'JetBrains Mono', 'SF Mono', Menlo, monospace; fill: #b45309; }
      .arrow { stroke: #4b5260; stroke-width: 1.6; fill: none; }
      .arrow-blue { stroke: #2b4be0; stroke-width: 1.7; fill: none; }
      .arrow-teal { stroke: #0d9488; stroke-width: 1.7; fill: none; }
      .arrow-amber { stroke: #d97706; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#4b5260"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#2b4be0"/>
    </marker>
    <marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0d9488"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="978" height="478" rx="12" class="bg"/>
  <text x="26" y="30" class="eyebrow">CHANGEPOINT FSM &amp; CONCURRENCY // PURE-MILLISECOND TIMELINE ENGINE</text>
  <text x="26" y="51" class="title">纯毫秒变化点状态机（防闪烁 / 巡检 / 否决）与多线程有界背压收敛管道</text>
  <line x1="26" y1="64" x2="954" y2="64" stroke="#e3e6ee" stroke-width="1"/>

  <!-- Top Panel: FSM -->
  <rect x="26" y="78" width="928" height="232" rx="10" class="panel"/>
  <text x="42" y="100" class="mono">PART 1 · THREE-STATE HYSTERESIS FSM（ChangePointDetector · 纯毫秒驱动）</text>

  <!-- State: Empty -->
  <rect x="48" y="156" width="144" height="72" rx="36" class="state-empty"/>
  <text x="93" y="188" class="h">Empty</text>
  <text x="72" y="207" class="sub">无字幕 / 静默态</text>

  <!-- Empty -> Stable (In) -->
  <path d="M 192 178 C 245 142, 315 142, 366 174" class="arrow-blue" marker-end="url(#ab)"/>
  <text x="206" y="138" class="mono">Event::In（回溯首现时刻）</text>
  <text x="206" y="153" class="sub" style="font-size:10px">前景持续 ≥ hysteresis_ms (200ms)</text>

  <!-- Stable -> Empty (Out) -->
  <path d="M 368 210 C 315 246, 245 246, 194 212" class="arrow" marker-end="url(#a)"/>
  <text x="208" y="258" class="h" style="font-size:11px">Event::Out（回溯首消失时刻）</text>
  <text x="208" y="273" class="sub" style="font-size:10px">前景消失持续 ≥ hysteresis_ms</text>

  <!-- State: Stable -->
  <rect x="370" y="152" width="152" height="80" rx="12" class="state-stable"/>
  <text x="418" y="182" class="h">Stable</text>
  <text x="386" y="201" class="sub">记录锚点签名 / 掩码</text>
  <text x="386" y="218" class="mono" style="font-size:9.8px">anchor_signature &amp; mask</text>

  <!-- Stable -> ChangeCandidate -> StablePrime -->
  <path d="M 522 178 L 570 178" class="arrow-blue" marker-end="url(#ab)"/>

  <rect x="574" y="118" width="184" height="122" rx="9" class="box-amber"/>
  <text x="586" y="138" class="mono-amber">ChangeCandidate 复核</text>
  <text x="586" y="156" class="sub" style="font-size:10.3px">触发源（满足其一）：</text>
  <text x="586" y="172" class="sub" style="font-size:10.2px">• dHash 距离 &gt; threshold (10)</text>
  <text x="586" y="187" class="sub" style="font-size:10.2px">• 掩码 SSIM &lt; 0.92</text>
  <text x="586" y="202" class="sub" style="font-size:10.2px">• 每 600ms 周期 SSIM 巡检</text>
  <text x="586" y="220" class="mono-amber" style="font-size:9.8px">持续 ≥ confirm_ms-20 且视觉一致</text>
  <text x="586" y="233" class="sub" style="font-size:9.8px">（若触发三分区保留否决则取消）</text>

  <!-- Candidate -> StablePrime -->
  <path d="M 758 178 L 796 178" class="arrow-teal" marker-end="url(#at)"/>
  <text x="760" y="168" class="mono-teal" style="font-size:9.5px">Change</text>

  <!-- State: StablePrime -->
  <rect x="800" y="152" width="136" height="80" rx="12" class="state-prime"/>
  <text x="823" y="182" class="h">StablePrime</text>
  <text x="814" y="201" class="sub">切换新字幕锚点</text>
  <text x="814" y="218" class="mono-teal" style="font-size:9.8px">双态交替防漏切</text>

  <!-- StablePrime -> Stable return arc -->
  <path d="M 868 232 C 868 282, 446 286, 446 236" class="arrow-teal" marker-end="url(#at)"/>
  <text x="576" y="282" class="mono-teal" style="font-size:10px">再次确认换句 → Event::Change 并切回 Stable（Out 亦可直接回 Empty）</text>

  <!-- Veto loop back -->
  <path d="M 666 118 C 666 96, 446 96, 446 148" class="arrow-amber" marker-end="url(#am)"/>
  <text x="488" y="108" class="mono-amber" style="font-size:9.8px">三分区字形保留否决 / 回弹锚点 → 丢弃候选</text>

  <!-- Bottom Panel: Concurrent Pipeline -->
  <rect x="26" y="326" width="928" height="136" rx="10" class="panel"/>
  <text x="42" y="348" class="mono">PART 2 · BOUNDED BACKPRESSURE CONCURRENT PIPELINE（AnalysisExecutor → Session → SegmentRecognizer）</text>

  <rect x="42" y="366" width="166" height="78" rx="8" class="box"/>
  <text x="54" y="387" class="h" style="font-size:12px">1. FFmpeg 帧生产</text>
  <text x="54" y="405" class="sub" style="font-size:10.3px">顺序解码 + ROI 裁剪</text>
  <text x="54" y="421" class="sub" style="font-size:10.3px">按单调 seq 投入有界队列</text>
  <text x="54" y="435" class="mono" style="font-size:9.5px">满队列背压阻塞防 OOM</text>

  <path d="M 208 405 L 236 405" class="arrow" marker-end="url(#a)"/>

  <rect x="240" y="366" width="212" height="78" rx="8" class="box-blue"/>
  <text x="252" y="387" class="h" style="font-size:12px">2. 多线程无序特征分析</text>
  <text x="252" y="405" class="sub" style="font-size:10.3px">AnalysisExecutor N 线程池</text>
  <text x="252" y="421" class="sub" style="font-size:10.3px">并行算自适应掩码 + dHash</text>
  <text x="252" y="435" class="mono" style="font-size:9.5px">每线程 OpenCV 单线程锁防争用</text>

  <path d="M 452 405 L 480 405" class="arrow-blue" marker-end="url(#ab)"/>

  <rect x="484" y="366" width="224" height="78" rx="8" class="box-teal"/>
  <text x="496" y="387" class="h" style="font-size:12px">3. 单线程有序状态机收敛</text>
  <text x="496" y="405" class="sub" style="font-size:10.3px">按 seq 严格重排 → FSM + Timeline</text>
  <text x="496" y="421" class="sub" style="font-size:10.3px">FrameEvalCache 帧内零堆缓存</text>
  <text x="496" y="435" class="mono-teal" style="font-size:9.5px">100% 并发确定性（结果逐字一致）</text>

  <path d="M 708 405 L 736 405" class="arrow-teal" marker-end="url(#at)"/>

  <rect x="740" y="366" width="198" height="78" rx="8" class="box-amber"/>
  <text x="752" y="387" class="h" style="font-size:12px">4. 异步段识别 / 条带流出</text>
  <text x="752" y="405" class="sub" style="font-size:10.3px">段闭合即送 OCR 代表帧共识</text>
  <text x="752" y="421" class="sub" style="font-size:10.3px">或纯打轴导出中点条带 (O(16)抽稀)</text>
  <text x="752" y="435" class="mono-amber" style="font-size:9.5px">支持协作式 cancel() 毫秒收敛</text>
</svg>
