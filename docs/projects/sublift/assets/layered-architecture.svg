<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560">
  <defs>
    <style>
      .bg { fill: #fafaf8; stroke: #d9dde6; stroke-width: 1.2; }
      .title { font: 700 15px -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Inter', sans-serif; fill: #111318; }
      .eyebrow { font: 600 10.5px 'JetBrains Mono', 'SF Mono', Menlo, monospace; fill: #2b4be0; letter-spacing: 0.08em; }
      .zone { fill: #ffffff; stroke: #cfd5e2; stroke-width: 1.3; }
      .zone-core { fill: #f7f9ff; stroke: #2b4be0; stroke-width: 1.6; }
      .zone-host { fill: #f5fbf9; stroke: #0d9488; stroke-width: 1.4; }
      .box { fill: #ffffff; stroke: #cfd5e2; stroke-width: 1.2; }
      .box-blue { fill: #eef3ff; stroke: #2b4be0; stroke-width: 1.3; }
      .box-teal { fill: #e9f8f5; stroke: #0d9488; stroke-width: 1.3; }
      .box-amber { fill: #fff8eb; stroke: #d97706; stroke-width: 1.3; }
      .box-dark { fill: #111318; stroke: #111318; stroke-width: 1.2; }
      .h { font: 700 12.5px -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Inter', sans-serif; fill: #111318; }
      .h-inv { font: 700 12px -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Inter', sans-serif; fill: #ffffff; }
      .sub { font: 500 10.8px -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Inter', sans-serif; fill: #4b5260; }
      .mono { font: 600 10.5px 'JetBrains Mono', 'SF Mono', Menlo, monospace; fill: #2b4be0; }
      .mono-teal { font: 600 10.5px 'JetBrains Mono', 'SF Mono', Menlo, monospace; fill: #0d9488; }
      .mono-red { font: 700 10px 'JetBrains Mono', 'SF Mono', Menlo, monospace; fill: #dc2626; }
      .arrow { stroke: #4b5260; stroke-width: 1.5; fill: none; }
      .arrow-blue { stroke: #2b4be0; stroke-width: 1.6; fill: none; }
      .arrow-teal { stroke: #0d9488; stroke-width: 1.6; fill: none; }
      .forbid { stroke: #dc2626; stroke-width: 1.4; stroke-dasharray: 4 3; fill: none; }
    </style>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#4b5260"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#2b4be0"/>
    </marker>
    <marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0d9488"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="978" height="558" rx="12" class="bg"/>
  <text x="26" y="30" class="eyebrow">ARCHITECTURE TOPOLOGY // CROSS-STACK LAYERED DEPENDENCY GRAPH</text>
  <text x="26" y="51" class="title">跨栈三层拓扑与 C++20 五层零泄漏算法核（check_dependencies.py 静态门禁守护）</text>
  <line x1="26" y1="64" x2="954" y2="64" stroke="#e3e6ee" stroke-width="1"/>

  <!-- Top Row: Frontend & Rust Host -->
  <rect x="26" y="78" width="430" height="96" rx="10" class="zone"/>
  <text x="40" y="99" class="mono">PLANE 1 · DESKTOP FRONTEND (React 19 + TS)</text>
  <rect x="40" y="110" width="112" height="50" rx="7" class="box-blue"/>
  <text x="54" y="131" class="h">ui/</text>
  <text x="54" y="148" class="sub">画布·队列·校对</text>
  <path d="M 152 135 L 182 135" class="arrow-blue" marker-end="url(#ab)"/>
  <rect x="186" y="110" width="118" height="50" rx="7" class="box"/>
  <text x="200" y="131" class="h">store/</text>
  <text x="200" y="148" class="sub">Zustand 单队列</text>
  <path d="M 304 135 L 334 135" class="arrow-blue" marker-end="url(#ab)"/>
  <rect x="338" y="110" width="104" height="50" rx="7" class="box"/>
  <text x="350" y="131" class="h">core/</text>
  <text x="350" y="148" class="sub">纯函数 ROI/时码</text>

  <!-- Arrow Frontend <-> Rust -->
  <path d="M 456 126 L 516 126" class="arrow-teal" marker-end="url(#at)" marker-start="url(#at)"/>
  <text x="462" y="117" class="mono-teal" style="font-size:9.2px">Tauri IPC</text>
  <text x="460" y="143" class="sub" style="font-size:9.2px">sublift://</text>

  <rect x="520" y="78" width="434" height="96" rx="10" class="zone-host"/>
  <text x="534" y="99" class="mono-teal">PLANE 2 · RUST HOST (Tauri 2 + Tokio)</text>
  <rect x="534" y="110" width="92" height="50" rx="7" class="box"/>
  <text x="544" y="131" class="h" style="font-size:11.5px">commands/</text>
  <text x="544" y="148" class="sub" style="font-size:10px">强类型入口</text>
  <rect x="636" y="110" width="96" height="50" rx="7" class="box-amber"/>
  <text x="648" y="131" class="h" style="font-size:11.5px">vlm/</text>
  <text x="648" y="148" class="sub" style="font-size:10px">拼图·对冲·自救</text>
  <rect x="742" y="110" width="96" height="50" rx="7" class="box"/>
  <text x="752" y="131" class="h" style="font-size:11.5px">media/</text>
  <text x="752" y="148" class="sub" style="font-size:10px">Range/Remux</text>
  <rect x="848" y="110" width="92" height="50" rx="7" class="box"/>
  <text x="858" y="131" class="h" style="font-size:11.5px">storage/</text>
  <text x="858" y="148" class="sub" style="font-size:10px">0600·草稿</text>

  <!-- Arrow Rust -> Composition Roots -->
  <path d="M 737 174 L 737 204" class="arrow-teal" marker-end="url(#at)"/>
  <text x="415" y="194" class="mono-teal" style="font-size:10px">stdio JSON-Lines（零端口 · stdin EOF 级联回收）</text>

  <!-- Composition Roots Bar -->
  <rect x="26" y="208" width="928" height="44" rx="8" class="box-dark"/>
  <text x="44" y="235" class="h-inv">组合根 (Composition Roots)：tools/worker (sublift_worker) · tools/cli (sublift_cli)</text>
  <text x="620" y="235" class="sub" style="fill:#9bb4ff">唯一允许同时装配 Engine 与具体 Adapters 的层</text>

  <!-- Arrow Composition Root -> Engine & Adapters -->
  <path d="M 330 252 L 330 282" class="arrow-blue" marker-end="url(#ab)"/>
  <path d="M 810 252 L 810 282" class="arrow" marker-end="url(#a1)"/>

  <!-- Left: C++20 Algorithm Core (5 Layers) -->
  <rect x="26" y="286" width="644" height="252" rx="10" class="zone-core"/>
  <text x="42" y="308" class="mono">PLANE 3 · C++20 ALGORITHM CORE（公共头文件零 OpenCV / ORT / FFmpeg / ObjC 泄漏）</text>

  <!-- Layer 4: Engine -->
  <rect x="42" y="320" width="612" height="44" rx="8" class="box-blue"/>
  <text x="58" y="340" class="h">sublift_engine（编排层）</text>
  <text x="234" y="340" class="sub">ExtractionSession · detect_auto_region · AnalysisExecutor · Observer</text>
  <text x="58" y="355" class="sub" style="font-size:10px">仅依赖 ports 抽象契约，完全不感知任何具体适配器</text>

  <!-- Arrows Engine -> Timing, Text, Ports -->
  <path d="M 176 364 L 176 386" class="arrow-blue" marker-end="url(#ab)"/>
  <path d="M 466 364 L 466 386" class="arrow-blue" marker-end="url(#ab)"/>

  <!-- Layer 2: Timing & Text (Mutually Exclusive) -->
  <rect x="42" y="390" width="268" height="46" rx="8" class="box"/>
  <text x="56" y="410" class="h">sublift_timing（打轴状态机）</text>
  <text x="56" y="426" class="sub">ChangePointDetector · TimelineBuilder</text>

  <!-- Mutual Exclusion marker -->
  <line x1="314" y1="413" x2="366" y2="413" class="forbid"/>
  <rect x="319" y="401" width="42" height="22" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="326" y="416" class="mono-red">⊥ 互斥</text>

  <rect x="370" y="390" width="284" height="46" rx="8" class="box"/>
  <text x="384" y="410" class="h">sublift_text（共识与后处理）</text>
  <text x="384" y="426" class="sub">line_select · consensus · 4-Pass dedupe · SRT</text>

  <!-- Arrow Timing -> Features -->
  <path d="M 176 436 L 176 458" class="arrow-blue" marker-end="url(#ab)"/>
  <text x="184" y="451" class="sub" style="font-size:9.8px">私有依赖（仅 timing 可见）</text>

  <!-- Features box -->
  <rect x="42" y="462" width="268" height="62" rx="8" class="box-amber"/>
  <text x="56" y="482" class="h">sublift_features（视觉特征）</text>
  <text x="56" y="498" class="sub">自适应掩码 · 分区 dHash · 掩码 SSIM</text>
  <text x="56" y="514" class="mono" style="fill:#b45309;font-size:9.8px">PRIVATE 链接 OpenCV（对外零泄漏）</text>

  <!-- Core + Ports foundation -->
  <rect x="330" y="462" width="156" height="62" rx="8" class="box"/>
  <text x="342" y="482" class="h">sublift_core</text>
  <text x="342" y="498" class="sub">SourceBox / ImageView</text>
  <text x="342" y="514" class="sub">RGB24 / Gray8 / ms</text>

  <rect x="498" y="462" width="156" height="62" rx="8" class="box-teal"/>
  <text x="510" y="482" class="h">sublift_ports</text>
  <text x="510" y="498" class="sub">IFrameSource · IOcrEngine</text>
  <text x="510" y="514" class="sub">IDetector · ISubtitleSink</text>

  <!-- Right: Adapters (Dependency Inversion) -->
  <rect x="690" y="286" width="264" height="252" rx="10" class="zone"/>
  <text x="704" y="308" class="mono-teal">ADAPTERS（依赖倒置 → Ports）</text>

  <rect x="704" y="322" width="236" height="46" rx="7" class="box"/>
  <text x="716" y="341" class="h" style="font-size:12px">adapter_ffmpeg</text>
  <text x="716" y="357" class="sub" style="font-size:10.3px">独立子进程 · 硬解 · noref 跳帧</text>

  <rect x="704" y="376" width="236" height="46" rx="7" class="box"/>
  <text x="716" y="395" class="h" style="font-size:12px">adapter_paddle</text>
  <text x="716" y="411" class="sub" style="font-size:10.3px">PRIVATE ONNX Runtime + OpenCV</text>

  <rect x="704" y="430" width="236" height="46" rx="7" class="box"/>
  <text x="716" y="449" class="h" style="font-size:12px">adapter_apple_vision</text>
  <text x="716" y="465" class="sub" style="font-size:10.3px">macOS PRIVATE ObjC++ (.mm)</text>

  <rect x="704" y="484" width="236" height="42" rx="7" class="box" style="stroke-dasharray:4 3"/>
  <text x="716" y="502" class="h" style="font-size:12px">adapter_mock</text>
  <text x="716" y="517" class="sub" style="font-size:10.3px">确定性单测 / 黄金回归打桩</text>

  <!-- Dependency inversion arrow: Adapters -> Ports -->
  <path d="M 690 493 L 658 493" class="arrow-teal" marker-end="url(#at)"/>
</svg>
